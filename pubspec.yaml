name: thuongmaidientu
description: A new Flutter project.
publish_to: 'none' # Remove this line if you wish to publish to pub.dev

version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # Firebase - Nền tảng Backend
  firebase_core: ^2.27.0
  firebase_auth: ^4.17.8
  cloud_firestore: ^4.15.8
  firebase_storage: ^11.6.9
  # firebase_messaging: ^14.7.19 # Tùy chọn
  # cloud_functions: ^4.6.8      # Tùy chọn

  # State Management
  provider: ^6.1.2

  # UI & Utilities
  cupertino_icons: ^1.0.8
  cached_network_image: ^3.3.1
  intl: ^0.19.0
  lottie: ^3.1.0
  image_picker: ^1.0.7
  # flutter_svg: ^2.0.10+1       # Tùy chọn nếu bạn dùng SVG

  # Biểu đồ thống kê
  fl_chart: ^0.67.0

  # Đăng nhập bên thứ ba
  google_sign_in: ^6.2.1

  # Dependency Injection
  get_it: ^7.6.7

  # Model comparison & immutability
  equatable: ^2.0.5              # Tùy chọn nếu dùng Bloc/Cubit

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^3.0.2

  # Nếu bạn dùng freezed/code generation
  # build_runner: ^2.4.9
  # freezed: ^2.4.7

flutter:
  uses-material-design: true

  assets:
    - assets/images/
